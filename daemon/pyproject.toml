[project]
name = "meshpincer"
version = "0.1.0"
description = "MeshCore radio service for MeshPincer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "meshcore>=2.3.14,<3",
  "pyserial>=3.5,<4",
  "uvicorn>=0.35,<1",
]

[project.scripts]
meshpincerd = "meshpincer.main:main"
meshpincer-repeater-login = "meshpincer.login_cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
